---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pandacloud-app
  labels:
    app: pandacloud-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pandacloud-app
  template:
    metadata:
      labels:
        app: pandacloud-app
    spec:
      containers:
      - name: pandacloud-container
        image: 724772051246.dkr.ecr.us-east-1.amazonaws.com/amazon-prime@sha256:32aa196f0f54a5a1ff03273fa7500e6faa77bc20cd32f9eb000835ed1a70a867
        ports:
        - containerPort: 3000
...
